<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORM STUDIES — DOTLAB motion study</title>
<style>
:root{color-scheme:dark;--bg:#000;--surface:#111;--line:#333;--ink:#f0f0f0;--accent:#ffcc00;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}button,a{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:6px}header{max-width:1440px;margin:auto;padding:28px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:24px}.brand{font-size:20px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--accent)}.controls{display:flex;gap:16px;align-items:center;font-size:12px}.study-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase}#motion{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:11px 14px;min-height:44px;display:flex;gap:9px;align-items:center}#motion:before{content:'';width:7px;height:7px;background:var(--accent);border-radius:50%}#motion[aria-checked=false]:before{background:var(--ink)}main{max-width:1440px;margin:auto;padding:48px 40px 64px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 22px}.eyebrow span{color:var(--accent);margin-right:14px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:38px}h1{font-size:clamp(44px,6vw,88px);letter-spacing:-.065em;line-height:.95;font-weight:500;margin:0}.intro p{font-size:14px;line-height:1.6;max-width:280px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{display:block;min-width:0}.art{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;aspect-ratio:4/3;contain:paint}.art svg{width:100%;height:100%;display:block}.card-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 2px}.card-meta h2{font-size:21px;font-weight:400;letter-spacing:-.035em;margin:0}.card-meta small{font-size:10px;letter-spacing:.12em;display:block;margin-top:9px}.arrow{font-size:22px}.card:hover .arrow{color:var(--accent)}footer{max-width:1360px;margin:0 auto;padding:24px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.detail-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:30px}.back{font-size:13px;padding:12px 0;min-height:44px}.back span{margin-right:12px;color:var(--accent)}.detail-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,1fr);gap:48px;align-items:center}.detail .art{border-radius:24px}.detail h1{font-size:clamp(48px,5vw,72px)}.description{font-size:15px;line-height:1.8;margin:30px 0 36px;max-width:360px}.facts{margin:0;font-size:11px;line-height:1.6}.facts div{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.facts dt{letter-spacing:.1em;text-transform:uppercase}.facts dd{margin:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
::view-transition{pointer-events:none}::view-transition-old(root){display:none}::view-transition-new(root){animation:none}::view-transition-group(root){animation:none}::view-transition-group(selected-art){animation-duration:420ms;animation-timing-function:cubic-bezier(.76,0,.16,1)}::view-transition-old(selected-art),::view-transition-new(selected-art){animation:none;mix-blend-mode:normal;height:100%}::view-transition-old(selected-art){display:none}
@media(max-width:760px){.brand{display:inline-flex;align-items:center;min-height:44px}header{padding:20px 22px;gap:12px}.study-tag{display:none}main{padding:34px 22px 40px}.intro{display:block;margin-bottom:28px}.intro p{margin-top:22px;max-width:320px}.grid{grid-template-columns:1fr;gap:20px}.card-meta{padding:17px 2px}.detail-layout{grid-template-columns:1fr;gap:30px}.detail-top{margin-bottom:20px}.detail h1{font-size:52px}.description{margin:22px 0 28px}footer{margin:0 22px;padding:22px 0;font-size:9px}.controls{gap:0}}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
<link rel="stylesheet" href="../../dot-ui.css?v=1"><script src="../../dot-ui.js?v=2" defer></script><script src="../../page-navigation.js?v=9"></script></head>
<body>
<header><a class="brand" href="../../?siteDesign=dot-lab#home" aria-label="DOT LABのホームへ">DOTLAB<span aria-hidden="true">·</span></a><div class="controls"><span class="study-tag">Independent motion study</span><button id="motion" type="button" role="switch" aria-checked="true" aria-label="Animate image transitions">Motion on</button></div></header>
<style>.easing-compare{position:relative;z-index:1;width:max-content;margin:12px 12px 12px auto;display:flex;flex-wrap:wrap;gap:12px;padding:10px 14px;border:1px solid #666;border-radius:8px;background:#111e;color:#eee;font:12px/1.6 Arial,sans-serif;max-width:calc(100vw - 24px);box-sizing:border-box}.easing-compare a{color:#eee;text-decoration:underline;text-underline-offset:3px}.easing-compare a:focus-visible{outline:2px solid #fc0;outline-offset:3px}.easing-compare strong{color:#fc0;font-weight:400}</style><aside class="easing-compare" aria-label="イージング比較"><strong>緩急 02</strong><a href="../original/shared-image/index.html">元の動き</a><a href="../../motion-table.html#shared-image">周期表へ</a></aside><main id="main"></main>
<footer><span>Form studies / 001—003</span><span>Original geometry · Study only</span></footer>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<script>
'use strict';
const works=[
{id:'orbit',name:'Orbit / 01',category:'Circular systems',description:'A quiet study of mass and negative space. Concentric circles hold their centre as the surrounding frame changes.',shape:'<circle cx="240" cy="180" r="125" fill="#f0f0f0"/><circle cx="240" cy="180" r="84" fill="#111"/><circle cx="240" cy="180" r="43" fill="#f0f0f0"/>'},
{id:'fold',name:'Fold / 02',category:'Planes in balance',description:'One plane becomes two. A diagonal cut creates a tension between solid form and the space left around it.',shape:'<path d="M110 70H370V290H110Z" fill="#333"/><path d="M110 70H370L110 290Z" fill="#f0f0f0"/><path d="M370 70V290H110Z" fill="#000"/><path d="M110 290L370 70" stroke="#f0f0f0" stroke-width="2"/>'},
{id:'rhythm',name:'Rhythm / 03',category:'Measured repetition',description:'An interval, repeated. Five vertical forms share a single baseline, finding a rhythm through their changing heights.',shape:'<g fill="#f0f0f0"><rect x="104" y="160" width="40" height="120"/><rect x="162" y="120" width="40" height="160"/><rect x="220" y="80" width="40" height="200"/><rect x="278" y="120" width="40" height="160"/><rect x="336" y="160" width="40" height="120"/></g>'}
];
const main=document.querySelector('#main'), toggle=document.querySelector('#motion'), status=document.querySelector('#status'), reduced=matchMedia('(prefers-reduced-motion: reduce)');
let current=null, revision=0, transition=null, motion=true, listY=0;
const readRoute=()=>works.find(w=>'#work/'+w.id===location.hash)||null;
const artwork=(w,selected)=>`<div class="art" data-art="${w.id}"${selected?' style="view-transition-name:selected-art"':''}><svg viewBox="0 0 480 360" role="img" aria-label="${w.category}: original monochrome geometric composition">${w.shape}</svg></div>`;
function render(work,shared){
current=work;document.title=work?`${work.name} — DOTLAB motion study`:'FORM STUDIES — DOTLAB motion study';
main.innerHTML=work?`<section class="detail" aria-labelledby="detail-title"><div class="detail-top"><a class="back" href="#"><span aria-hidden="true">←</span>一覧へ</a><span class="eyebrow" style="margin:0">FORM / 0${works.indexOf(work)+1}</span></div><div class="detail-layout">${artwork(work,shared===work.id)}<div><p class="eyebrow"><span>0${works.indexOf(work)+1}</span>${work.category}</p><h1 id="detail-title" tabindex="-1">${work.name}</h1><p class="description">${work.description}</p><dl class="facts"><div><dt>Format</dt><dd>Geometric study</dd></div><div><dt>Palette</dt><dd>Monochrome</dd></div><div><dt>Collection</dt><dd>Form studies, 2026</dd></div></dl></div></div></section>`:`<section aria-labelledby="list-title"><p class="eyebrow"><span>01—03</span>Selected form studies</p><div class="intro"><h1 id="list-title" tabindex="-1">Same form.<br>New perspective.</h1><p>Three original compositions.<br>Select a study to take a closer look.</p></div><div class="grid">${works.map(w=>`<a class="card" href="#work/${w.id}" data-card="${w.id}" aria-label="View ${w.name}, ${w.category}">${artwork(w,shared===w.id)}<div class="card-meta"><div><h2>${w.name}</h2><small>${w.category}</small></div><span class="arrow" aria-hidden="true">↗</span></div></a>`).join('')}</div></section>`;
}
function updateToggle(){const enabled=motion&&!reduced.matches;toggle.setAttribute('aria-checked',String(enabled));toggle.textContent=reduced.matches?'動きを抑える':motion?'モーション ON':'即時切替';toggle.setAttribute('aria-label',reduced.matches?'Animate image transitions, disabled by reduced motion preference':'Animate image transitions');toggle.disabled=reduced.matches;}
function navigate(next,{focus=true}={}){
if(current?.id===next?.id&&!transition)return;
const old=current,id=next?.id||old?.id,token=++revision;
if(!old)listY=scrollY;
transition?.skipTransition();transition=null;
document.querySelectorAll('[data-art]').forEach(e=>e.style.viewTransitionName='none');
const canAnimate=motion&&!reduced.matches&&typeof document.startViewTransition==='function'&&!(old&&next);
if(canAnimate)document.querySelector(`[data-art="${id}"]`)?.style.setProperty('view-transition-name','selected-art');
const update=()=>{if(token!==revision)return;render(next,canAnimate?id:null);scrollTo(0,next?0:listY);if(focus){const target=next?document.querySelector('#detail-title'):document.querySelector(`[data-card="${old?.id}"]`)||document.querySelector('#list-title');target?.focus({preventScroll:true});}status.textContent=next?`${next.name}, detail`:'All three form studies';};
if(canAnimate){try{const active=document.startViewTransition(update);transition=active;active.ready.catch(()=>{});active.finished.catch(()=>{}).finally(()=>{if(token===revision){transition=null;document.querySelectorAll('[data-art]').forEach(e=>e.style.viewTransitionName='none');}});}catch{update();}}
else update();
}
document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(!link||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();const hash=link.getAttribute('href');if(location.hash===hash||(hash==='#'&&!location.hash))return;history.pushState({},'',hash);navigate(readRoute());});
addEventListener('popstate',()=>navigate(readRoute()));
addEventListener('hashchange',()=>navigate(readRoute()));
toggle.addEventListener('click',()=>{motion=!motion;if(!motion)transition?.skipTransition();updateToggle();});
reduced.addEventListener('change',()=>{if(reduced.matches)transition?.skipTransition();updateToggle();});
if('scrollRestoration'in history)history.scrollRestoration='manual';
render(readRoute(),null);updateToggle();
</script>
</body>
</html>
