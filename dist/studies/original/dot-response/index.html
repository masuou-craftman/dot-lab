*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#000;color:#fff;font-family:Arial,'Noto Sans CJK JP',sans-serif;display:grid;place-items:center;padding:28px 16px}.card{width:min(480px,100%);padding:32px;background:#111;border:1px solid #333;border-radius:20px}.eyebrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.5px;color:#aaa}.brand{font-weight:700;color:white;letter-spacing:2.5px}h1{font-size:28px;line-height:1.4;letter-spacing:.03em;margin:29px 0 8px}p{font-size:14px;line-height:1.9;color:#bbb;margin:0}.figure{margin:24px 0 0}svg{width:100%;height:auto;display:block}.legend{font-size:12px;color:#aaa;display:flex;gap:8px;align-items:center;justify-content:center}.origin{width:6px;height:6px;background:#fc0;border-radius:50%;display:inline-block}.foot{border-top:1px solid #333;margin-top:28px;padding-top:24px;display:flex;gap:16px;align-items:center;justify-content:space-between}button{background:white;color:black;font:600 14px inherit;border:0;border-radius:999px;min-height:48px;padding:0 24px;white-space:nowrap;cursor:pointer}button:focus-visible{outline:2px solid #fc0;outline-offset:5px}button:active{background:#ddd}.note{font-size:11px;line-height:1.7;color:#aaa}.reduced{display:none}.standard{display:block}@media(prefers-reduced-motion:reduce){.reduced{display:block}.standard{display:none}}@media(max-width:380px){.card{padding:24px}h1{font-size:24px}.foot{align-items:flex-start;flex-direction:column}button{width:100%}}
</style><style>.study-return-nav{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px;padding:12px 16px;border:1px solid #666;border-radius:8px;background:#111;color:#eee;font:12px/1.7 Arial,sans-serif}.study-return-nav a{color:#eee;text-decoration:underline;text-underline-offset:3px}.study-return-nav a:focus-visible{outline:2px solid #fc0;outline-offset:4px}.study-return-nav span{color:#fc0}</style><nav class="study-return-nav" aria-label="習作の移動"><a href="../../../?siteDesign=dot-lab#home">DOT LAB / ホーム</a><span>元の緩急</span><a href="../../dot-response/index.html">強い緩急版へ</a><a href="../../../motion-table.html#dot-response">周期表へ</a></nav><article class="card"><div class="eyebrow"><span class="brand">DOTLAB</span><span>実験カード / 01</span></div><h1>位相差の見本</h1><p>同じ動きに、小さな時間差。<br>起点からの距離が、反応の順番をつくる。</p><figure class="figure"><svg viewBox="0 0 414 276" aria-hidden="true" id="grid"></svg><figcaption class="legend"><span class="origin"></span>中央の黄色い点が起点 / 7 × 7</figcaption></figure><div class="foot"><button type="button" id="play">動きを見る <span aria-hidden="true">↗</span></button><p class="note standard">一度だけ反応し、静止します。<br>読み込み表示ではありません。</p><p class="note reduced">動きを抑え、静止図を表示中。<br>黄色い起点から外へ広がる見本。</p></div></article><script>
const svg=document.getElementById('grid'),play=document.getElementById('play'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const dots=[];let frame=0,start=0;
for(let y=0;y<7;y++)for(let x=0;x<7;x++){const el=document.createElementNS('http://www.w3.org/2000/svg','circle');el.setAttribute('cx',111+x*32);el.setAttribute('cy',42+y*32);el.setAttribute('r','5.5');el.setAttribute('fill',x===3&&y===3?'#ffcc00':'#aaa');svg.append(el);dots.push({el,d:Math.hypot(x-3,y-3),origin:x===3&&y===3})}
function draw(t){for(const {el,d,origin} of dots){let p=(t-d*120)/540;let pulse=p>0&&p<1?Math.sin(Math.PI*p)**2:0;el.setAttribute('r',origin?5.5:5.5+5.5*pulse);let c=Math.round(170+85*pulse);el.setAttribute('fill',origin?'#ffcc00':`rgb(${c},${c},${c})`)}}
function stop(){cancelAnimationFrame(frame);frame=0;draw(-1)}
function tick(now){draw(now-start);if(now-start<1100)frame=requestAnimationFrame(tick);else stop()}
play.addEventListener('click',()=>{stop();if(!reduced.matches){start=performance.now();frame=requestAnimationFrame(tick)}});
play.addEventListener('keydown',e=>{if(e.repeat&&(e.key==='Enter'||e.key===' '))e.preventDefault()});
reduced.addEventListener('change',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
</script></html>
