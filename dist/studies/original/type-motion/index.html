function poses(t,j){for(let k=0;k<2;k++){let start=[1.40,3.65][k],local=t-start-j*.065;if(local>-.15&&local<.70){if(local<0)return[[k,0,1-.055*Math.sin(Math.PI*(local+.15)/.15)]];let p=clamp(local/.70),e=ease(p),sy=1+.12*Math.sin(Math.PI*p)**2;return[[k,-270*e,sy],[k+1,270*(1-e),sy]]}if(t<start-.15+j*.065)return[[k,0,1]]}return[[2,0,1]]}
function text(s,x,y,size=17,color='#f0f0f0'){ctx.fillStyle=color;ctx.font=`${size}px monospace`;ctx.textBaseline='top';ctx.fillText(s,x,y+3)}
function line(x,y,x2){ctx.fillStyle='#333';ctx.fillRect(x,y,x2-x,1)}
function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,1080,810);text('DOTLAB  /  TYPE STUDY',72,62);text('01 — RISE',824,62,17,'#aaa');line(72,105,1008);ctx.save();ctx.beginPath();ctx.rect(0,286,1080,240);ctx.clip();for(let j=0;j<4;j++)for(const[k,dy,sy]of poses(t,j)){const sx=1-(sy-1)*.35,w=Math.round(240*sx),h=Math.round(260*sy);ctx.drawImage(glyphs[words[k][j]],Math.round(100+j*216+(240-w)/2),Math.round(286+dy+240-h),w,h)}ctx.restore();line(106,540,974);let stage=t<1.95?0:t<4.20?1:2;text('0'+(stage+1),109,579,17,'#ffcc00');text(labels[stage],163,579);text('KINETIC TYPE / BASELINE EXCHANGE',72,734,15,'#777');text('MOTION STUDY',827,734,15,'#777');seek.value=t;time.value=t.toFixed(1)+' / 6.6 s'}
function pause(){running=false;play.textContent='再生'}
function tick(now){if(!running)return;t=Math.min(duration,t+(now-last)/1000);last=now;draw();if(t>=duration)pause();else requestAnimationFrame(tick)}
function start(){if(t>=duration)t=0;if(running)return;running=true;last=performance.now();play.textContent='一時停止';requestAnimationFrame(tick)}
play.onclick=()=>running?pause():start();replay.onclick=()=>{pause();t=0;draw();start()};seek.oninput=()=>{pause();t=Number(seek.value);draw()};document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
Promise.all(Object.entries(assets).map(([c,src])=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{glyphs[c]=im;resolve()};im.onerror=reject;im.src=src}))).then(draw);
</script></html>
