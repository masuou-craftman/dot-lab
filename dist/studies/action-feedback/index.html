<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DOTLAB — Action feedback study</title><style>
:root{color-scheme:dark;font-family:Arial,'Noto Sans CJK JP',sans-serif;background:#000;color:#f0f0f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:36px 24px}main{width:min(100%,760px)}.eyebrow,footer,.serial{font:12px 'Courier New',monospace;letter-spacing:.09em}.eyebrow{display:flex;align-items:center;gap:12px}.eyebrow:before{content:'';width:7px;height:7px;border-radius:50%;background:#ffcc00}h1{font-size:clamp(30px,5vw,48px);line-height:1.3;letter-spacing:-.04em;margin:36px 0 18px}header p{font-size:14px;line-height:1.8;color:#b8b8b8;margin:0}.panel{background:#111;border:1px solid #333;border-radius:20px;margin-top:36px;padding:32px}.topline{display:flex;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid #333}.serial{color:#b8b8b8}.small{font-size:12px;color:#b8b8b8}.demo{display:flex;align-items:center;gap:36px;padding:36px 0}.action{position:relative;isolation:isolate;flex:none;width:192px;height:56px;border:0;border-radius:8px;background:transparent;color:#f0f0f0;font:700 15px Arial,'Noto Sans CJK JP',sans-serif;cursor:pointer}.face{position:absolute;inset:0;border:1px solid #f0f0f0;border-radius:8px;background:#111;z-index:-1;transition:transform 220ms cubic-bezier(.12,.9,.2,1),background-color 100ms}.action:active .face{transform:scale(.97);background:#333;transition-duration:70ms;transition-timing-function:cubic-bezier(.6,0,.9,.3)}.action[aria-disabled=true]{cursor:wait}.action[aria-disabled=true] .face{border-color:#555}.action:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #ffcc00;outline-offset:5px}.status{min-width:0;display:flex;gap:12px;align-items:center}.indicator{width:18px;height:18px;position:relative;flex:none}.indicator:before{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:#777;left:5px;top:5px}.processing .indicator:before{background:#ffcc00;animation:signal 700ms cubic-bezier(.76,0,.18,1) infinite alternate}.success .indicator:before{width:12px;height:6px;border-radius:0;border-left:2px solid #f0f0f0;border-bottom:2px solid #f0f0f0;transform:rotate(-45deg);background:none;left:3px;top:3px}.error .indicator:before{content:'!';font:bold 17px Arial;color:#ffcc00;background:none;top:0}.status strong{font-size:15px;font-weight:400;display:block;line-height:1.5}.status .sub{font-size:12px;color:#b8b8b8;display:block;margin-top:5px;line-height:1.6}.controls{border-top:1px solid #333;padding-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}label{font-size:12px;color:#b8b8b8;display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}input{accent-color:#ffcc00;width:16px;height:16px}button.minor{font:12px Arial,'Noto Sans CJK JP',sans-serif;color:#f0f0f0;border:1px solid #333;border-radius:7px;background:#111;min-height:44px;padding:0 15px;cursor:pointer}.minor:disabled{color:#777;cursor:default}.secondary{display:flex;gap:8px}.note{font-size:11px;color:#999;line-height:1.8;margin:20px 0 0}footer{display:flex;justify-content:space-between;border-top:1px solid #333;margin-top:30px;padding-top:18px;color:#999}.reduce{margin-top:14px;font-size:11px}.reduced .face{transition:none}.reduced .action:active .face{transform:none}.reduced .processing .indicator:before{animation:none}@keyframes signal{from{transform:translateY(2px);opacity:.45}to{transform:translateY(-2px);opacity:1}}@media(prefers-reduced-motion:reduce){.face{transition:none}.action:active .face{transform:none}.processing .indicator:before{animation:none}}@media(max-width:560px){body{padding:32px 20px}.panel{padding:24px 20px}.demo{flex-direction:column;align-items:flex-start;gap:28px;padding:30px 0}.status{min-height:52px}h1{margin-top:30px}.topline{gap:12px;flex-wrap:wrap}.action{width:100%}footer{font-size:10px}.controls{gap:8px}.secondary{width:100%}.minor{flex:1}}
</style><link rel="stylesheet" href="../../dot-ui.css?v=1"><script src="../../dot-ui.js?v=2" defer></script><script src="../../page-navigation.js?v=2"></script></head><body><style>.easing-compare{position:relative;z-index:1;width:max-content;margin:12px 12px 12px auto;display:flex;flex-wrap:wrap;gap:12px;padding:10px 14px;border:1px solid #666;border-radius:8px;background:#111e;color:#eee;font:12px/1.6 Arial,sans-serif;max-width:calc(100vw - 24px);box-sizing:border-box}.easing-compare a{color:#eee;text-decoration:underline;text-underline-offset:3px}.easing-compare a:focus-visible{outline:2px solid #fc0;outline-offset:3px}.easing-compare strong{color:#fc0;font-weight:400}</style><aside class="easing-compare" aria-label="イージング比較"><strong>緩急 02</strong><a href="../original/action-feedback/index.html">元の動き</a><a href="../../motion-table.html#action-feedback">周期表へ</a></aside><main><header><div class="eyebrow">DOTLAB / MOTION STUDY 04</div><h1>操作に、手応えを。</h1><p>押した瞬間は小さく。終わったら、静かに。</p></header><section class="panel" aria-label="操作フィードバックの見本"><div class="topline"><span class="serial">01 / ACTION FEEDBACK</span><span class="small">外部送信なし・状態表示の見本</span></div><div class="demo"><button class="action" id="run" aria-disabled="false"><span class="face" aria-hidden="true"></span>動作サンプル</button><div class="status idle" id="status" role="status" aria-live="polite" aria-atomic="true"><span class="indicator" aria-hidden="true"></span><div><strong id="label">操作を待っています</strong><span class="sub" id="sub">ボタンを押すと、見本が始まります。</span></div></div></div><div class="controls"><label><input type="checkbox" id="error">エラーの見本にする</label><div class="secondary"><button class="minor" id="cancel" disabled>キャンセル</button><button class="minor" id="reset">リセット</button></div></div><p class="note">約1秒の待機は、状態の変化を見せるためのシミュレーションです。</p></section><label class="reduce"><input type="checkbox" id="reduce">動きを抑えた表示を試す</label><footer><span>SMALL RESPONSE. CLEAR STATE.</span><span>LOCAL STUDY / 2026</span></footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let revision=0,timer=null,state='idle';const copy={idle:['操作を待っています','ボタンを押すと、見本が始まります。'],processing:['処理中の見本','約1秒で、結果の表示に切り替わります。'],success:['完了の見本','動きを止めて、結果を残します。'],error:['エラーの見本','実際の失敗ではありません。再試行できます。'],cancelled:['キャンセルしました','見本を中止しました。もう一度試せます。']};function render(next){state=next;$('status').className='status '+next;[$('label').textContent,$('sub').textContent]=copy[next];$('run').setAttribute('aria-disabled',String(next==='processing'));$('cancel').disabled=next!=='processing';}function invalidate(){revision++;clearTimeout(timer);timer=null;}function start(){if(state==='processing')return;invalidate();const ticket=revision,result=$('error').checked?'error':'success';render('processing');timer=setTimeout(()=>{if(ticket!==revision)return;timer=null;render(result)},1000)}$('run').addEventListener('click',start);$('cancel').addEventListener('click',()=>{invalidate();render('cancelled');$('run').focus()});$('reset').addEventListener('click',()=>{invalidate();render('idle')});$('reduce').addEventListener('change',event=>document.documentElement.classList.toggle('reduced',event.target.checked));window.addEventListener('pagehide',invalidate);})();
</script></body></html>
