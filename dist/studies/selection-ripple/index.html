<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOTLAB — 選択、そのあと</title><style>
:root{color-scheme:dark;--bg:#000;--surface:#111;--line:#333;--ink:#f0f0f0;--accent:#ffcc00;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}button,a{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:6px}header{max-width:1440px;margin:auto;padding:28px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:24px}.brand{font-size:20px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--accent)}.controls{display:flex;gap:16px;align-items:center;font-size:12px}.study-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase}#motion{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:11px 14px;min-height:44px;display:flex;gap:9px;align-items:center}#motion:before{content:'';width:7px;height:7px;background:var(--accent);border-radius:50%}#motion[aria-checked=false]:before{background:var(--ink)}main{max-width:1440px;margin:auto;padding:48px 40px 64px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 22px}.eyebrow span{color:var(--accent);margin-right:14px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:38px}h1{font-size:clamp(44px,6vw,88px);letter-spacing:-.065em;line-height:.95;font-weight:500;margin:0}.intro p{font-size:14px;line-height:1.6;max-width:280px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{display:block;min-width:0}.art{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;aspect-ratio:4/3;contain:paint}.art svg{width:100%;height:100%;display:block}.card-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 2px}.card-meta h2{font-size:21px;font-weight:400;letter-spacing:-.035em;margin:0}.card-meta small{font-size:10px;letter-spacing:.12em;display:block;margin-top:9px}.arrow{font-size:22px}.card:hover .arrow{color:var(--accent)}footer{max-width:1360px;margin:0 auto;padding:24px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.detail-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:30px}.back{font-size:13px;padding:12px 0;min-height:44px}.back span{margin-right:12px;color:var(--accent)}.detail-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,1fr);gap:48px;align-items:center}.detail .art{border-radius:24px}.detail h1{font-size:clamp(48px,5vw,72px)}.description{font-size:15px;line-height:1.8;margin:30px 0 36px;max-width:360px}.facts{margin:0;font-size:11px;line-height:1.6}.facts div{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.facts dt{letter-spacing:.1em;text-transform:uppercase}.facts dd{margin:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
::view-transition{pointer-events:none}::view-transition-old(root){display:none}::view-transition-new(root){animation:none}::view-transition-group(root){animation:none}::view-transition-group(selected-art){animation-duration:420ms;animation-timing-function:cubic-bezier(.76,0,.16,1)}::view-transition-old(selected-art),::view-transition-new(selected-art){animation:none;mix-blend-mode:normal;height:100%}::view-transition-old(selected-art){display:none}
@media(max-width:760px){.brand{display:inline-flex;align-items:center;min-height:44px}header{padding:20px 22px;gap:12px}.study-tag{display:none}main{padding:34px 22px 40px}.intro{display:block;margin-bottom:28px}.intro p{margin-top:22px;max-width:320px}.grid{grid-template-columns:1fr;gap:20px}.card-meta{padding:17px 2px}.detail-layout{grid-template-columns:1fr;gap:30px}.detail-top{margin-bottom:20px}.detail h1{font-size:52px}.description{margin:22px 0 28px}footer{margin:0 22px;padding:22px 0;font-size:9px}.controls{gap:0}}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

.grid{grid-template-columns: minmax(0,360px) 1fr}.list-note{max-width:380px;align-self:center;font-size:14px;line-height:1.9;color:#aaa}.detail-layout{grid-template-columns:minmax(0,1.35fr) minmax(260px,1fr)}.description{color:#bbb}.study-tag{color:#aaa}.art svg{aspect-ratio:4/3}.art{border-radius:20px!important}.detail h1{font-size:40px;line-height:1.25}.intro h1{line-height:1.05}footer{margin:0 40px}.eyebrow{line-height:1.6}@media(max-width:760px){.grid{grid-template-columns:1fr}.list-note{display:none}.detail-layout{grid-template-columns:1fr;gap:25px}.intro h1{font-size:44px}.detail h1{font-size:38px}.description{margin:18px 0 24px}.card{max-width:360px}footer{margin:0 22px}.detail-top{margin-bottom:12px}}</style><link rel="stylesheet" href="../../dot-ui.css?v=1"><script src="../../dot-ui.js?v=2" defer></script><script src="../../page-navigation.js?v=7"></script></head><body><header><a class="brand" href="../../?siteDesign=dot-lab#home" aria-label="DOT LABのホームへ">DOTLAB<span aria-hidden="true">·</span></a><span class="study-tag">Independent motion study / 06</span></header><style>.easing-compare{position:relative;z-index:1;width:max-content;margin:12px 12px 12px auto;display:flex;flex-wrap:wrap;gap:12px;padding:10px 14px;border:1px solid #666;border-radius:8px;background:#111e;color:#eee;font:12px/1.6 Arial,sans-serif;max-width:calc(100vw - 24px);box-sizing:border-box}.easing-compare a{color:#eee;text-decoration:underline;text-underline-offset:3px}.easing-compare a:focus-visible{outline:2px solid #fc0;outline-offset:3px}.easing-compare strong{color:#fc0;font-weight:400}</style><aside class="easing-compare" aria-label="イージング比較"><strong>緩急 02</strong><a href="../original/selection-ripple/index.html">元の動き</a><a href="../../motion-table.html#selection-ripple">周期表へ</a></aside><main id="main"></main><footer><span>Selection → response</span><span>Study only · Intro unchanged</span></footer><div id="status" class="sr-only" role="status"></div><script>
'use strict';
const main=document.querySelector('#main'), reduced=matchMedia('(prefers-reduced-motion: reduce)');
let current=false, revision=0, transition=null, waves=[],listY=0,desired=false;
const route=()=>location.hash==='#work/phase';
function artwork(shared){let circles='';for(let y=0;y<7;y++)for(let x=0;x<7;x++){circles+=`<circle cx="${144+x*32}" cy="${84+y*32}" r="5.5" fill="${x===3&&y===3?'#ffcc00':'#aaa'}" data-distance="${Math.hypot(x-3,y-3)}"/>`;}return `<div class="art"${shared?' style="view-transition-name:selected-art"':''}><svg viewBox="0 0 480 360" role="img" aria-label="白とグレーの7×7ドット。中央の黄色い点が起点。">${circles}</svg></div>`;}
function render(detail,shared=false){current=detail;main.innerHTML=detail?`<section class="detail" aria-labelledby="detail-title"><div class="detail-top"><a class="back" href="#"><span aria-hidden="true">←</span>一覧へ</a><span class="eyebrow" style="margin:0">STUDY / 06</span></div><div class="detail-layout">${artwork(shared)}<div><p class="eyebrow"><span>01</span>Local response</p><h1 id="detail-title" tabindex="-1">選択、そのあと。</h1><p class="description">同じ図が、手元へ。<br>位置が決まってから、点が一度だけ反応。<br>動く役割を、順番に渡す。</p><dl class="facts"><div><dt>01 / 移動</dt><dd>420 ms · 緩急を強調</dd></div><div><dt>02 / 反応</dt><dd>約 1.05 s · 一度だけ</dd></div><div><dt>状態</dt><dd>${reduced.matches?'静止図 / 動きを抑える設定':'詳細を表示済み'}</dd></div></dl><p class="description" style="font-size:12px;margin-bottom:0">読み込みや進行状況の表示ではありません。</p></div></div></section>`:`<section aria-labelledby="list-title"><p class="eyebrow"><span>06</span>Works / motion study</p><div class="intro"><h1 id="list-title" tabindex="-1">選ぶ。<br>それから、反応。</h1><p>移動と波を、重ねずにつなぐ。<br>今のイントロは、そのままに。</p></div><div class="grid"><a class="card" href="#work/phase" aria-label="位相差の見本を開く">${artwork(shared)}<div class="card-meta"><div><h2>位相差の見本</h2><small>Local response / 7 × 7</small></div><span class="arrow" aria-hidden="true">↗</span></div></a><p class="list-note">小さなカードから、詳細へ。<br>図の位置が落ち着いたあと、<br>黄色い起点から、短い波が広がります。</p></div></section>`;document.title=detail?'選択、そのあと — DOTLAB':'DOTLAB — 選択、そのあと';}
function stopWave(){waves.forEach(a=>a.cancel());waves=[];}
function pulse(p){if(p<=0||p>=1)return 0;if(p<.24){const q=p/.24;return q*q*q*(q*(q*6-15)+10)}const q=(p-.24)/.76;return Math.pow(1-q*q*(3-2*q),3)}
function wave(token){if(token!==revision||!current||reduced.matches||document.hidden)return;stopWave();document.querySelectorAll('circle').forEach(el=>{const d=+el.dataset.distance;if(!d)return;const frames=Array.from({length:41},(_,i)=>{const p=pulse(i/40),c=Math.round(170+85*p);return {r:`${5.5+5.5*p}px`,fill:`rgb(${c},${c},${c})`};});waves.push(el.animate(frames,{duration:540,delay:d*120,fill:'none'}));});const active=waves;Promise.allSettled(active.map(a=>a.finished)).then(()=>{if(token===revision&&waves===active)stopWave();});}
function navigate(next){if(next===desired)return;desired=next;const old=current,token=++revision;stopWave();const interrupted=!!transition;transition?.skipTransition();transition=null;document.querySelector('.art')?.style.setProperty('view-transition-name','none');if(!old)listY=scrollY;const animate=!interrupted&&!reduced.matches&&!document.hidden&&typeof document.startViewTransition==='function';if(animate)document.querySelector('.art')?.style.setProperty('view-transition-name','selected-art');const update=()=>{if(token!==revision)return;render(next,animate);scrollTo(0,next?0:listY);document.querySelector(next?'#detail-title':'.card')?.focus({preventScroll:true});document.querySelector('#status').textContent=next?'位相差の見本、詳細を表示':'作品一覧';};if(animate){try{const active=document.startViewTransition(update);transition=active;active.ready.catch(()=>{});active.finished.then(()=>{if(token!==revision)return;transition=null;document.querySelector('.art')?.style.setProperty('view-transition-name','none');if(next)wave(token);},()=>{if(token===revision){transition=null;document.querySelector('.art')?.style.setProperty('view-transition-name','none');}});}catch{update();}}else update();}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();const hash=a.getAttribute('href');if(location.hash===hash||(hash==='#'&&!location.hash))return;history.pushState({},'',hash);navigate(route());});
document.addEventListener('keydown',e=>{if(e.repeat&&(e.key==='Enter'||e.key===' '))e.preventDefault();});
addEventListener('popstate',()=>navigate(route()));addEventListener('hashchange',()=>navigate(route()));
function reconcile(){++revision;transition?.skipTransition();transition=null;stopWave();desired=route();render(desired);}
reduced.addEventListener('change',()=>{if(reduced.matches){reconcile();document.querySelector(current?'#detail-title':'.card')?.focus({preventScroll:true});}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)reconcile();});
if('scrollRestoration'in history)history.scrollRestoration='manual';desired=route();render(desired);
</script></body></html>
