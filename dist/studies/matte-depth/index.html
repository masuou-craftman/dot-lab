const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),button=document.querySelector('button'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
function state(t){for(let k=0;k<DATA.keys.length-1;k++){const[ta,a]=DATA.keys[k],[tb,b]=DATA.keys[k+1];if(t<=tb){let u=Math.max(0,Math.min(1,(t-ta)/(tb-ta)));const launch=u**3,land=(1-u)**5;u=launch/(launch+land);return a.map((p,i)=>p.map((v,j)=>v+(b[i][j]-v)*u));}}return DATA.keys.at(-1)[1];}
function project(v,p){let[x,y]=v,[tx,ty,tz,ay,ax]=p;ay*=Math.PI/180;ax*=Math.PI/180;const xx=x*Math.cos(ay),z=-x*Math.sin(ay),yy=y*Math.cos(ax)-z*Math.sin(ax),zz=y*Math.sin(ax)+z*Math.cos(ax),s=800/(800-zz-tz);return[360+(xx+tx)*s,370+(yy+ty)*s];}
function path(pts,close){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(close)ctx.closePath();}
function text(x,y,s,size,color){ctx.font=`${size}px monospace`;ctx.fillStyle=color;ctx.textBaseline='top';ctx.fillText(s,x,y);}
function rule(y){path([[44,y],[676,y]],false);ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.stroke();}
function draw(t){ctx.fillStyle='#000';ctx.fillRect(0,0,720,720);text(44,39,'DOTLAB / MOTION STUDY',14,'#aaa');text(44,72,'LAYER SELECT',28,'#f0f0f0');rule(126);const poses=state(t);[0,1,2].sort((a,b)=>poses[a][2]-poses[b][2]).forEach(i=>DATA.shapes[i].forEach(sh=>{path(sh.pts.map(v=>project(v,poses[i])),sh.pts.length>2);if(sh.fill){ctx.fillStyle=sh.fill;ctx.fill();}if(sh.stroke){ctx.strokeStyle=sh.stroke;ctx.lineWidth=sh.width;ctx.lineJoin='round';ctx.stroke();}}));rule(603);text(44,629,'03 PLANES / 01 SELECTION',14,'#aaa');text(44,659,'MATTE DEPTH   -   WORKS CARD STUDY',12,'#777');}
let raf=0,start=0;function tick(now){const t=Math.min(DATA.duration,(now-start)/1000);draw(t);if(t<DATA.duration)raf=requestAnimationFrame(tick);else raf=0;}
function play(){cancelAnimationFrame(raf);if(reduce.matches){draw(DATA.duration);return;}start=performance.now();raf=requestAnimationFrame(tick);}button.addEventListener('click',play);reduce.addEventListener('change',play);document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;draw(DATA.duration);}});play();
