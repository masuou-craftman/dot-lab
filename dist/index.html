  }

    let x = Number.isFinite(origin?.x) ? origin.x : 0;
    let y = Number.isFinite(origin?.y) ? origin.y : 0;
    let baseRadius = Math.max(0, Number.isFinite(radius) ? radius : 76);
    const rgb = [0, 1, 2].map(i => Math.round(Math.max(0, Math.min(255, color[i] ?? [255, 204, 0][i]))));

    const viewport=()=>({width:parent.viewBox?.baseVal.width||x*2||1,height:parent.viewBox?.baseVal.height||y*2||1});

      {x: .82, y: -.58, size: .021, delay: .04},
      {x: -.46, y: .86, size: .031, delay: .075},
      {x: .7, y: .66, size: .025, delay: .025},
      {x: .1, y: -1.14, size: .019, delay: .095},
      {x: -1.04, y: .24, size: .022, delay: .06}

      const node = element('circle', {cx: x, cy: y, r: '0', fill, opacity: '0'});

<script>
(() => {
  'use strict';
  // Public site facts only. This guide is deliberately labelled separately
  // from model-generated answers and never consumes unpublished character notes.
  const link=(label,route)=>({label,route});
  function reply(question='',page=''){
    const text=String(question).normalize('NFKC').trim().toLowerCase();
    if(/(?:ai|人工知能|チャットgpt|chatgpt|本物|接続|誰と|だれと)/u.test(text))return {
      message:'今は、AIに接続せず、このサイトに用意した案内文で答える「サイト案内」です。作品、ブログ、DOT LABの紹介ページを案内できます。',
      links:[link('ブログへ','blog'),link('DOT LABについて','profile')]

    if(/(?:作品|制作|作った|つくった|ポートフォリオ|works|周期表|モーション|イージング|緩急|four\s*edges|組み合わせ)/u.test(text))return {
      message:'「モーションエフェクト周期表」に14の習作を並べています。緩急の実験台では、同じ距離・時間で進み方を比較できます。別作品の「FOUR EDGES」は、4本の線を組み合わせた9.6秒の習作です。どちらも作品のページから開けます。',
      links:[link('作品へ','works')]
    };
    if(/(?:遊|あそ|丸|まる|親玉|ドット|仕掛|しかけ|動き|アニメ|精霊|ぽよ)/u.test(text))return {
      message:'ホームのドットは、アイコン・まる・面の順に自動で形を変えます。「一時停止」で好きな形を眺めたり、図形をなぞったり「波を送る」を押したりしてみて。最初の形はDOT LABのマーク。右下の丸は、起動画面からついてくる案内役です。',
      links:[link('ホームで遊ぶ','home')]
    };
    if(/(?:ブログ|記事|記録|読|よみ|日記|ノート|最新)/u.test(text))return {
      message:'ブログはDOT LABの制作ノートです。今は「触れる楽しさを、かたちにする」という表示確認用のサンプル記事が読めます。制作ノートの見本としてご覧ください。',
      links:[link('サンプル記事を読む','post/first-note'),link('ブログ一覧へ','blog')]
    };
    if(/(?:sns|x\b|twitter|youtube|連絡|リンク|活動先|アカウント)/u.test(text))return {
      message:'作品を探すときは「作品」、動きを試すときは「モーションエフェクト周期表」へ。リンクページには、公開する関連資料をまとめていきます。',
      links:[link('リンクへ','links')]
    };
    if(/(?:dot\s*lab|このサイト|自己紹介|プロフィール|作者|誰|だれ)/u.test(text))return {
      message:'DOT LABは、点・線・動き・触り心地を試して遊ぶウェブの実験室です。モーションを見比べたり、緩急を自分で調整したり、ブラウザで作品を体験できます。',
      links:[link('DOT LABについて','profile')]
    };
    if(/(?:暗|明る|色|テーマ|ダーク|ライト)/u.test(text))return {
      message:'ページ上部の、半分だけ塗られた丸いボタンで明るい表示と暗い表示を切り替えられます。選んだ表示は、同じブラウザーで次に開いたときにも引き継ぎます。',
      links:[]

    if(/(?:ありがと|助か|いいね|かわいい|可愛い)/u.test(text))return {
      message:'どういたしまして。気になるページがあったら、また声をかけてね。',links:[]
    };
    if(/(?:こんにちは|こんばんは|おはよう|はじめまして|よろしく|やっほ)/u.test(text))return {
      message:'こんにちは。DOT LABへようこそ。動きの周期表や緩急エディターで、気になる動きを試してみて。',
      links:[link('ブログを読む','blog'),link('DOT LABについて','profile')]

    const article=String(page).replace(/^#/,'')==='post/first-note';
    return {
      message:article
        ?'いま開いているのは、触れる楽しさをテーマにしたサンプル記事です。ほかにはブログの一覧や、DOT LABの紹介も案内できます。'
        :'今はサイト案内として、このサイトに用意した案内文で答えています。「ブログを読みたい」「DOT LABって？」「ドットで遊びたい」など、気になることを聞いてみて。',
      links:[link('ブログへ','blog'),link('DOT LABについて','profile')]

  }
  window.MasuouAssistantGuide=Object.freeze({reply});
})();

    function directionSafe(){

    }

    }
    function wake(){if(!dead&&!document.hidden&&!frame&&['ready','playing'].includes(state))frame=requestAnimationFrame(tick);}
    function begin(){
      if(dead)return;

      paddle.x=targetX=WIDTH/2;paddle.vx=0;Object.assign(ball,{x:WIDTH/2,y:235.5,vx:0,vy:0,speed:190});effects=[];build();serve();
      announce('左右キー・A / Dでバーを動かす。Space / Enterかタップで発射。');arena.focus({preventScroll:true});
      if(document.hidden)pauseGame('「つづける」で準備に戻れるよ。');
    }
    function launch(){

      if(focused&&!document.hidden&&document.hasFocus())arena.focus({preventScroll:true});
    }
    function resume(){

      state=pausedFrom;releaseInputs();controls();draw();announce(state==='ready'?'Space / Enterか「ボールを飛ばす」で発射。':'つづきから再開。');arena.focus({preventScroll:true});if(state==='playing')wake();

    listen(root,'keydown',event=>{

    listen(reduced,'change',()=>{clearEffects();pulse=wallPulse=0;if(svg)draw();});idle();
    const api={destroy(){

      arena.replaceChildren();arena.style.touchAction=previousTouchAction;intro.hidden=false;session.hidden=true;
      start.hidden=false;start.disabled=true;start.textContent='ブロック崩しで遊ぶ';pause.hidden=true;close.hidden=true;if(launchButton)launchButton.hidden=true;
      for(const key of ['gameState','gameScore','gameLives','gameTime','gameBallX','gameBallY','gameBallVx','gameBallVy','gamePaddleX'])delete root.dataset[key];mounted.delete(root);

<script>
/* A shared, matte surface for droplets close enough to exchange a short neck. */
(() => {
  'use strict';
  const NS='http://www.w3.org/2000/svg',PI=Math.PI;
  const clamp=(value,low,high)=>Math.max(low,Math.min(high,value));
  function create(parent){
    const groups=new Map();
    let dead=false,links=new Set();
    const keyFor=(a,b)=>[String(a.id),String(b.id)].sort().join(':');
    const ellipseExtent=(drop,nx,ny)=>Math.hypot((nx*drop.c+ny*drop.s)*drop.a,(-nx*drop.s+ny*drop.c)*drop.b);
    const extent=(drop,nx,ny)=>Math.max(...drop.lobes.map(lobe=>(lobe.x-drop.x)*nx+(lobe.y-drop.y)*ny+ellipseExtent(lobe,nx,ny)));
    function clear(){for(const group of groups.values()){group.renderer.destroy();group.node.remove();}groups.clear();links.clear();}
    function render(list,options={}){
      const hiddenIds=new Set(),positions=new Map();
      const input=(Array.isArray(list)?list:[]).filter(d=>d&&Number.isFinite(d.x)&&Number.isFinite(d.y)&&Number.isFinite(d.r)&&d.r>0).map(d=>{
        const ratio=clamp((d.sx>0?d.sx:1)/(d.sy>0?d.sy:1),1/1.3,1.3),angle=Number.isFinite(d.angle)?d.angle:0;
        const a=d.r*Math.sqrt(ratio),b=d.r/Math.sqrt(ratio);
        const drop={...d,sx:a/d.r,sy:b/d.r,angle,a,b,c:Math.cos(angle),s:Math.sin(angle),softness:clamp(d.r*.8,4,12)};
        const fx=Number.isFinite(d.flow?.x)?d.flow.x:0,fy=Number.isFinite(d.flow?.y)?d.flow.y:0;
        const length=Math.hypot(fx,fy),amount=Math.min(1,length),nx=length?fx/length:0,ny=length?fy/length:0;
        drop.flowing=amount>.002;
        // These are contour handles, not extra water. A lagging lobe grows out
        // of the same body while its logical mass and hand position stay fixed.
        // At rest it is completely nested, so it never becomes another bead.
        const lobe=(factor,offset)=>({...drop,r:d.r*factor,a:a*factor,b:b*factor,
          x:d.x+nx*d.r*offset,y:d.y+ny*d.r*offset,softness:clamp(d.r*factor*.8,4,12)});
        drop.lobes=drop.flowing?[lobe(1-.06*amount,.08*amount),lobe(.42,-.95*amount)]:[{...drop}];
        return drop;
      });
      let area=0,components=input.length,cells=0;
      for(const drop of input){positions.set(drop.id,{x:drop.x,y:drop.y});area+=PI*drop.r*drop.r;}
      if(dead||!parent?.append||!globalThis.SoftContour?.create)return{hiddenIds,positions,components,area,cells};
      const bounds={left:18,top:18,right:462,bottom:262,...options.bounds};
      const roots=input.map((_,i)=>i),currentLinks=new Set();
      const root=index=>{while(roots[index]!==index){roots[index]=roots[roots[index]];index=roots[index];}return index;};
      for(let i=0;i<input.length;i++)for(let j=i+1;j<input.length;j++){
        const a=input[i],b=input[j],dx=b.x-a.x,dy=b.y-a.y,distance=Math.hypot(dx,dy),nx=distance?dx/distance:1,ny=distance?dy/distance:0;
        const gap=distance-extent(a,nx,ny)-extent(b,-nx,-ny),key=keyFor(a,b);

      const used=new Set();
      for(const members of clusters.values()){
        if(members.length<2&&!members[0].flowing)continue;

        let group=groups.get(key);
        if(!group){
          const node=document.createElementNS(NS,'g');node.setAttribute('class','water-surface-component');node.dataset.waterSurfaceComponent=key;parent.append(node);
          group={node,renderer:globalThis.SoftContour.create(node)};groups.set(key,group);
        }

        // contributes its own shorter blend distance, rather than a long stem.
        members.sort((a,b)=>Number(Boolean(b.main))-Number(Boolean(a.main))||b.r-a.r||String(a.id).localeCompare(String(b.id)));
        const targetArea=members.reduce((sum,d)=>sum+PI*d.r*d.r,0),main=members.find(d=>d.main);

          x:members.reduce((sum,d)=>sum+d.x*PI*d.r*d.r,0)/targetArea,
          y:members.reduce((sum,d)=>sum+d.y*PI*d.r*d.r,0)/targetArea

        if(!(metrics.area>0)||!metrics.regions?.length){group.node.style.display='none';continue;}
        group.node.style.display='';
        const left=Math.min(...metrics.regions.map(r=>r.bounds.left)),right=Math.max(...metrics.regions.map(r=>r.bounds.right));
        const top=Math.min(...metrics.regions.map(r=>r.bounds.top)),bottom=Math.max(...metrics.regions.map(r=>r.bounds.bottom));
        const dx=right-left<=bounds.right-bounds.left?clamp(0,bounds.left-left,bounds.right-right):(bounds.left+bounds.right-left-right)/2;
        const dy=bottom-top<=bounds.bottom-bounds.top?clamp(0,bounds.top-top,bounds.bottom-bottom):(bounds.top+bounds.bottom-top-bottom)/2;
        group.node.setAttribute('transform',`translate(${dx} ${dy})`);
        group.node.dataset.waterSurfaceArea=String(metrics.area);
        group.node.dataset.waterSurfaceCells=String(metrics.cells||0);
        group.node.dataset.waterSurfaceLoops=String(metrics.components);
        group.node.dataset.waterSurfaceScale=String(metrics.scale);
        members.forEach(drop=>{
          hiddenIds.add(drop.id);
          // Faces belong to logical drops, not to one of their contour lobes.
          positions.set(drop.id,{x:anchor.x+(drop.x-anchor.x)*metrics.scale+dx,y:anchor.y+(drop.y-anchor.y)*metrics.scale+dy});
        });
        components+=metrics.components-members.length;cells+=metrics.cells||0;
      }
      for(const[key,group]of groups)if(!used.has(key)){group.renderer.destroy();group.node.remove();groups.delete(key);}
      parent.dataset.waterSurfaceGroups=String(groups.size);parent.dataset.waterSurfaceArea=String(area);parent.dataset.waterSurfaceCells=String(cells);
      return{hiddenIds,positions,components,area,cells};
    }
    return{render,destroy(){if(dead)return;dead=true;clear();for(const name of ['waterSurfaceGroups','waterSurfaceArea','waterSurfaceCells'])if(parent?.dataset)delete parent.dataset[name];}};
  }
  globalThis.MasuouWaterSurface=Object.freeze({create});
})();

</script>

    '1':['00100','01100','00100','00100','00100','00100','01110'],
    '2':['01110','10001','00001','00010','00100','01000','11111'],

    '6':['01110','10000','10000','11110','10001','10001','01110'],
    '7':['11111','00001','00010','00100','01000','01000','01000'],

<script>

  document.querySelector('#theme-button').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';applyTheme();try{localStorage.setItem(THEME_KEY,theme);}catch{}status.textContent=theme==='dark'?'暗い表示にしました':'明るい表示にしました';});
  function dots(){
    for(const svg of document.querySelectorAll('[data-dots]')){
      const word=svg.dataset.dots;const columns=word.length*6-1;svg.setAttribute('viewBox',`0 0 ${columns*10} 70`);
      for(let y=0;y<7;y++)for(let x=0;x<columns;x++){
        const letter=Math.floor(x/6),col=x%6;const on=col<5&&((glyphs[word[letter]]?.[y]||0)&(1<<(4-col)));
        if(!on)continue;
        const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('cx',x*10+5);dot.setAttribute('cy',y*10+5);dot.setAttribute('r','3.15');if(on)dot.classList.add('is-on');svg.append(dot);
      }

    }
  }
  function mountMotions(){
    for(const link of document.querySelectorAll('.site-header nav a,.primary-link,.text-link,.archive-link,.page-back,.list-entry')){
      if(link.querySelector(':scope > [data-liquid],[data-dot-scene]'))continue;
      const mark=document.createElement('span');mark.className='liquid-link-mark';mark.dataset.liquid='link';mark.setAttribute('aria-hidden','true');link.prepend(mark);
    }
    const ui=window.MasuouLiquidUI?.mount(document);
    const wordmarks=window.MasuouLiquidWordmark?.mount(document);
    motions={destroy(){ui?.destroy();wordmarks?.destroy();}};
  }
  const routeFromHash=()=>{
    const route=location.hash.slice(1);
    return !route||route==='home'?'home':Object.hasOwn(pages,route)?route:'not-found';
  };
  const pageMotion=window.MasuouPageMotion?.create(main);
  let pendingOrigin=null;
  // Route changes restore their own scroll, including browser Back / Forward.
  if('scrollRestoration' in history)history.scrollRestoration='manual';
  function focusPage(){
    const target=current==='home'?(returnTarget&&document.querySelector(returnTarget))||main:main.querySelector('h1');
    if(target){if(current!=='home')target.tabIndex=-1;target.focus({preventScroll:true});}
  }
  function disposePage(){
    const components=[boot,scenes,playground,motions,errorPage];
    boot=scenes=playground=motions=errorPage=null;
    for(const component of components){try{component?.destroy();}catch(error){console.error('Could not clean up a page effect.',error);}}
  }
  function renderError(code){
    current=code===404?'not-found':'error';main.dataset.page=current;
    document.title=(code===404?'ページが見つかりません':'うまく表示できませんでした')+' — DOT LAB';
    if(window.MasuouErrorPages){
      main.innerHTML=window.MasuouErrorPages.markup({code});
      errorPage=window.MasuouErrorPages.mount(main);
    }else{
      // Keep recovery available even if the error illustration failed to load.
      main.innerHTML='<article class="page"><p class="page-kicker">'+code+'</p><h1>ページを表示できませんでした。</h1><p class="page-intro">もう一度読み込むか、ホームへ戻ってみてください。</p><a class="page-back" href="#home" data-route="home">ホームへ戻る →</a><button class="theme-button" type="button" data-error-retry aria-label="もう一度読み込む">↻</button></article>';
      main.querySelector('[data-error-retry]').addEventListener('click',()=>location.reload());
    }
    document.querySelectorAll('.site-header nav a').forEach(a=>a.removeAttribute('aria-current'));
    try{scenes=window.MasuouDotScenes?.render(document);mountMotions();}catch(error){console.error('Could not draw the navigation dots.',error);}
  }
  function renderContent(focus,next){
    disposePage();
    current=next;main.dataset.page=next;
    if(next==='not-found'){renderError(404);window.scrollTo(0,0);if(focus){focusPage();status.textContent='ページが見つかりませんでした';}return;}
    if(next==='home'){main.replaceChildren(document.querySelector('#home-template').content.cloneNode(true));document.title='DOT LAB — 動きを、遊びに。';dots();if(focus)window.scrollTo(0,homeScroll);}
    else{main.innerHTML=`<article class="page">${pages[next].html}</article>`;document.title=pages[next].title+' — DOT LAB';window.scrollTo(0,0);}
    document.querySelectorAll('.site-header nav a').forEach(a=>{const active=a.dataset.route===next||(next.startsWith('post/')&&a.dataset.route==='blog');if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    scenes=window.MasuouDotScenes?.render(document);
    playground=window.MasuouDotPlayground?.mount(document);
    mountMotions();
    if(focus)focusPage();
    if(focus)status.textContent=next==='home'?'ホームへ戻りました':pages[next].title+'を開きました';
  }
  function render(focus=false,next=routeFromHash()){
    try{renderContent(focus,next);}
    catch(error){
      console.error('Could not display the page.',error);disposePage();
      try{renderError(500);}
      catch{main.innerHTML='<article class="page"><h1>ページを表示できませんでした。</h1><p>再読み込みして、もう一度お試しください。</p><a class="page-back" href="#home" data-route="home">ホームへ戻る →</a></article>';current='error';main.dataset.page=current;}
      window.scrollTo(0,0);if(focus)focusPage();status.textContent='ページを表示できませんでした。再読み込みするかホームへ戻ってください';
    }
  }
  function navigate(next,origin){
    if(current==='home'&&next!=='home'){
      homeScroll=scrollY;
      returnTarget=origin&&main.contains(origin)&&origin.id?'#'+origin.id:null;
    }
    if(boot){boot.destroy();boot=null;pageMotion?.cancel();render(true,next);return;}
    if(next===current){pageMotion?.cancel();focusPage();return;}
    if(pageMotion)pageMotion.run(()=>render(true,next),{origin});
    else render(true,next);
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('.skip')&&e.button===0&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.shiftKey){e.preventDefault();main.focus();return;}
    const a=e.target.closest('[data-route]');
    if(!a||e.defaultPrevented||e.button!==0||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||a.hasAttribute('download')||(a.target&&a.target!=='_self'))return;
    e.preventDefault();
    if(location.hash==='#'+a.dataset.route){pendingOrigin=null;navigate(routeFromHash(),a);}
    else{pendingOrigin=a;location.hash=a.dataset.route;}
  });
  window.addEventListener('hashchange',()=>{const origin=pendingOrigin;pendingOrigin=null;navigate(routeFromHash(),origin);});
  document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.target.closest?.('.site-assistant'))return;const active=routeFromHash();if(e.key==='Escape'&&active!=='home'){e.preventDefault();location.hash=active.startsWith('post/')?'blog':'home';}});
  applyTheme();render();
  const assistant=window.MasuouAssistant?.mount({parent:document.querySelector('.site-shell'),endpoint:'/api/assistant'});
  const internalReturn=(()=>{try{const from=new URL(document.referrer);return from.origin===location.origin&&from.pathname.startsWith(new URL('./',location.href).pathname);}catch{return false;}})();
  if(current==='home'&&(!location.hash||location.hash==='#home')&&!internalReturn){
    boot=window.MasuouBoot?.mount({shell:document.querySelector('.site-shell'),assistant,onFinish:()=>{
      boot=null;
      if(current==='home')status.textContent='DOT LABをひらきました';
    }});
  }
})();

</script>
<script>
/* Optional DOT LAB input feedback. Existing page, boot and dot clocks stay intact. */
(() => {
  'use strict';
  const html=document.documentElement,NS='http://www.w3.org/2000/svg';
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const round=n=>Math.round(n*1000)/1000;
  let preference=new URLSearchParams(location.search).get('labMotion')==='off'?'off':'on';
  let nav=null,svg=null,dots=[],activeLink=null,frame=0,job=null,dead=false;
  let box=null,resizeObserver=null,navObserver=null,shellObserver=null;
  const listeners=[];
  const offsets=[-5,0,5],radii=[1.1,1.4,1.1],rates=[46,50,54];
  html.dataset.labMotion=preference;
  html.dataset.labEasing=new URLSearchParams(location.search).get("labEasing")==="off"?"off":"on";
  let pulseButton=null;
  function clearPulse(){pulseButton?.classList.remove("lab-input-pulse");pulseButton=null;}
  const enabled=()=>!dead&&preference==='on'&&html.dataset.siteDesign==='dot-lab';
  const blocked=()=>document.hidden||html.hasAttribute('data-boot')||!!nav?.closest('[inert]');
  const listen=(node,type,fn)=>{node.addEventListener(type,fn);listeners.push(()=>node.removeEventListener(type,fn));};
  function stop(){if(frame)cancelAnimationFrame(frame);frame=0;job=null;if(svg)svg.dataset.motion='idle';}
  function remove(){stop();svg?.remove();svg=null;dots=[];activeLink=null;box=null;}
  function create(){
    if(svg||!nav)return;
    svg=document.createElementNS(NS,'svg');
    svg.classList.add('lab-nav-cue');svg.setAttribute('aria-hidden','true');svg.setAttribute('focusable','false');
    svg.dataset.motion='idle';
    dots=radii.map((r,i)=>{const node=document.createElementNS(NS,'circle');node.setAttribute('r',r);svg.append(node);return{node,x:0,v:0,offset:offsets[i],rate:rates[i]};});
    nav.append(svg);
  }
  function measure(){
    if(!svg)return null;
    box=svg.getBoundingClientRect();
    if(!(box.width>0&&box.height>0))return null;
    svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);
    return box;
  }
  function destination(link){
    const rect=link.getBoundingClientRect();
    return clamp(rect.x+rect.width/2-box.x,8,Math.max(8,box.width-8));
  }
  function draw(){
    if(!svg||!box)return;
    const y=Math.max(2,box.height-1.5);
    for(const dot of dots){dot.node.setAttribute('cx',round(dot.x));dot.node.setAttribute('cy',round(y));}
  }
  function settle(center){
    stop();for(const dot of dots){dot.x=center+dot.offset;dot.v=0;}
    draw();svg.style.visibility='';
  }
  // A critically damped trajectory retains velocity when a rapid navigation
  // changes the destination. Three slightly different responses spread then
  // gather the dots, with no delayed queue and no ongoing physics at rest.
  function sample(now){
    if(!job)return;
    const elapsed=Math.max(0,(now-job.start)/1000),done=elapsed>=.28;
    dots.forEach((dot,i)=>{
      const from=job.from[i],target=job.center+dot.offset,delta=from.x-target;
      const b=from.v+dot.rate*delta,decay=Math.exp(-dot.rate*elapsed);
      dot.x=done?target:target+(delta+b*elapsed)*decay;
      dot.v=done?0:(b-dot.rate*(delta+b*elapsed))*decay;
      const bounded=clamp(dot.x,2,Math.max(2,box.width-2));
      if(bounded!==dot.x){dot.x=bounded;dot.v=0;}
    });
    draw();if(done)stop();
  }
  function tick(now){
    frame=0;
    if(!enabled()||blocked()||reduced.matches){sync(false);return;}
    sample(now);if(job)frame=requestAnimationFrame(tick);
  }
  function sync(animate=false){
    if(!enabled()){remove();return;}
    create();if(!svg)return;
    if(blocked()){stop();svg.style.visibility='hidden';activeLink=null;return;}
    const next=nav.querySelector('a[aria-current="page"]');
    if(!next){stop();svg.style.visibility='hidden';activeLink=null;return;}
    if(!measure())return;
    const center=destination(next),changed=next!==activeLink;
    if(animate&&changed&&activeLink&&!reduced.matches){
      const now=performance.now();if(job)sample(now);
      const from=dots.map(({x,v})=>({x,v}));
      stop();job={start:now,center,from};svg.style.visibility='';svg.dataset.motion='travelling';
      frame=requestAnimationFrame(tick);
    }else if(changed||!animate||!job)settle(center);
    activeLink=next;
  }
  function mount(){
    if(dead||nav)return;
    nav=document.querySelector('.site-header nav');if(!nav)return;
    navObserver=new MutationObserver(()=>sync(true));
    navObserver.observe(nav,{attributes:true,subtree:true,attributeFilter:['aria-current']});
    const shell=nav.closest('.site-shell');
    if(shell){shellObserver=new MutationObserver(()=>sync(false));shellObserver.observe(shell,{attributes:true,attributeFilter:['inert']});}
    if(typeof ResizeObserver==='function'){
      resizeObserver=new ResizeObserver(()=>sync(false));resizeObserver.observe(nav);
      for(const link of nav.querySelectorAll('a'))resizeObserver.observe(link);
    }
    sync(false);
  }
  const rootObserver=new MutationObserver(()=>{clearPulse();sync(false);});
  rootObserver.observe(html,{attributes:true,attributeFilter:['data-site-design','data-boot']});
  listen(document,'visibilitychange',()=>{clearPulse();sync(false);});
  listen(document,'click',event=>{
    const button=event.target.closest?.('.dot-play-toggle');
    if(!button){clearPulse();return;}
    if(!button||!enabled()||blocked()||reduced.matches||html.dataset.labEasing!=='on')return;
    clearPulse();pulseButton=button;
    void button.offsetWidth;
    button.classList.add('lab-input-pulse');
  });
  listen(document,'animationend',event=>{if(event.animationName==='lab-dot-input'&&event.target===pulseButton)clearPulse();});
  listen(reduced,'change',clearPulse);
  listen(window,'pagehide',clearPulse);
  listen(window,'resize',()=>sync(false));
  listen(reduced,'change',()=>sync(false));
  listen(window,'pagehide',()=>{stop();if(svg)svg.style.visibility='hidden';});
  listen(window,'pageshow',()=>sync(false));
  function set(value){
    if(dead||(value!=='on'&&value!=='off'))return false;
    preference=value;html.dataset.labMotion=value;clearPulse();
    const url=new URL(location.href);url.searchParams.set('labMotion',value);
    try{history.replaceState(history.state,'',url);}catch{}
    sync(false);return true;
  }
  if(document.querySelector('.site-header nav'))mount();else document.addEventListener('DOMContentLoaded',mount,{once:true});
  globalThis.MasuouLabMotion=Object.freeze({get:()=>preference,set,destroy(){
    if(dead)return;dead=true;clearPulse();remove();rootObserver.disconnect();navObserver?.disconnect();shellObserver?.disconnect();resizeObserver?.disconnect();
    for(const dispose of listeners)dispose();document.removeEventListener('DOMContentLoaded',mount);
    delete html.dataset.labMotion;delete html.dataset.labEasing;nav=null;
  }});
})();

</script>
<script>
/* Prime only the public, self-contained error screen; application files stay fresh. */
(() => {
  'use strict';
  if(typeof window==='undefined'||typeof navigator==='undefined'||!('serviceWorker' in navigator))return;
  if(!window.isSecureContext||!['http:','https:'].includes(location.protocol))return;
  if(document.documentElement.hasAttribute('data-single-file')||document.documentElement.hasAttribute('data-error-offline'))return;
  if(window.__masuouOfflineClient)return;
  window.__masuouOfflineClient=true;
  const script=document.currentScript;
  const base=new URL(script?.dataset.offlineBase||'.',script?.src||location.href);
  if(base.origin!==location.origin)return;
  const workerURL=new URL('offline-worker.js',base);
  const refresh=worker=>{
    if(worker&&navigator.onLine!==false)worker.postMessage({type:'MASUOU_REFRESH_OFFLINE'});
  };
  navigator.serviceWorker.register(workerURL.href,{scope:base.pathname,updateViaCache:'none'}).then(registration=>{
    if(registration.active){refresh(registration.active);return;}
    const worker=registration.installing||registration.waiting;
    if(!worker)return;
    const activated=()=>{
      if(worker.state==='activated'){worker.removeEventListener('statechange',activated);refresh(worker);}
      else if(worker.state==='redundant')worker.removeEventListener('statechange',activated);
    };
    worker.addEventListener('statechange',activated);activated();
  }).catch(()=>{/* The site and error game work without offline storage. */});
})();

</script>
